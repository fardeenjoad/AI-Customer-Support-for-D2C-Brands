name: Deploy backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/AI-Customer-Support-for-D2C-Brands
            git pull origin main
            sudo systemctl restart resolveiq
            sudo systemctl status resolveiq
            echo "=== SERVER IP DETAILS ==="
            curl -s https://ifconfig.me || true
            echo ""
            echo "=== SYSTEMCTL STATUS NGINX ==="
            sudo systemctl status nginx || true
            echo "=== NGINX CONFIG ==="
            cat /etc/nginx/nginx.conf || true
            echo "=== NGINX SITES ==="
            sudo cat /etc/nginx/sites-enabled/* /etc/nginx/conf.d/* || true
            echo "=== PORT LISTENING STATUS ==="
            sudo ss -tulpn || true
            echo "=== UFW STATUS ==="
            sudo ufw status verbose || true
            echo "=== NGINX ERROR LOGS ==="
            sudo tail -n 50 /var/log/nginx/error.log || true
            echo "=== NGINX ACCESS LOGS ==="
            sudo tail -n 50 /var/log/nginx/access.log || true
            echo "=== LOCAL CURL TO PORT 8000 ==="
            sleep 3
            curl -v http://localhost:8000/health || true
            echo "=== JOURNALCTL RESOLVEIQ ==="
            sudo journalctl -u resolveiq -n 50 --no-pager || true
