name: Deploy backend to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/AI-Customer-Support-for-D2C-Brands
            git pull origin main
            sudo systemctl restart resolveiq
            sudo systemctl status resolveiq
            
            echo "=== AUTOMATED NGINX & SSL MIGRATION ==="
            config_file=""
            for file in /etc/nginx/sites-available/* /etc/nginx/sites-enabled/*; do
              if [ -f "$file" ] && grep -q "16-170-205-254" "$file"; then
                config_file="$file"
                break
              fi
            done
            
            if [ -n "$config_file" ]; then
              echo "Found Nginx config file: $config_file"
              sudo sed -i 's/16-170-205-254/51-21-240-124/g' "$config_file"
              echo "Running Certbot for new domain 51-21-240-124.sslip.io..."
              sudo certbot --nginx -d 51-21-240-124.sslip.io --non-interactive --agree-tos --email aakib5460@gmail.com --redirect || true
              sudo systemctl reload nginx
            else
              echo "No config file containing old IP was found. Running Certbot just in case..."
              sudo certbot --nginx -d 51-21-240-124.sslip.io --non-interactive --agree-tos --email aakib5460@gmail.com --redirect || true
              sudo systemctl reload nginx
            fi
